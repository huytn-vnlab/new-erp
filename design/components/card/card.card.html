<!-- @dsCard group="Components" viewport="700x200" name="Card" subtitle="Surface — rest · interactive hover-lift · accent-tinted" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body{margin:0;padding:22px;background:hsl(var(--background));font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .c{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius-card);box-shadow:0 1px 2px 0 rgb(0 0 0 / .03);padding:18px}
  .c.lift{border-color:hsl(var(--primary-h) var(--primary-s) 57% / .45);box-shadow:0 6px 18px -8px hsl(var(--primary-h) var(--primary-s) 50% / .22)}
  .c.tint{background-image:radial-gradient(ellipse 80% 60% at 100% 0%,hsl(var(--primary-h) var(--primary-s) 57% / .09),transparent 70%)}
  .t{font-size:13.5px;font-weight:600;color:hsl(var(--foreground));letter-spacing:-.01em}
  .d{font-size:12px;color:hsl(var(--muted-foreground));margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div class="grid">
  <div class="c"><div class="t">Mặc định</div><div class="d">Bề mặt tiêu chuẩn, viền mảnh, bóng nhẹ.</div></div>
  <div class="c lift"><div class="t">Tương tác (hover)</div><div class="d">Nâng lên với viền + bóng màu nhấn.</div></div>
  <div class="c tint"><div class="t">Có tint nhấn</div><div class="d">Vệt sáng góc trên phải cho thẻ thống kê.</div></div>
</div>
</body>
</html>
