<!-- @dsCard group="Components" viewport="700x150" name="Button" subtitle="Gradient primary · outline · ghost · danger · success · sizes" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body{margin:0;padding:22px;background:hsl(var(--background))}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;font-size:13px;font-family:var(--font-sans);font-weight:600;white-space:nowrap;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;transition:all .16s ease}
  .btn.sm{height:32px;padding:0 10px;font-size:12.5px}
  .btn.xs{height:28px;padding:0 8px;font-size:11.5px}
  .primary{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-card)}
  .outline{background:hsl(var(--card));color:hsl(var(--foreground));border-color:hsl(var(--border))}
  .ghost{background:transparent;color:hsl(var(--foreground) / .8)}
  .danger{background:hsl(var(--danger));color:#fff}
  .success{background:hsl(var(--success));color:#fff}
  .disabled{opacity:.5;cursor:not-allowed}
  svg{width:14px;height:14px}
</style>
</head>
<body>
<div class="row">
  <button class="btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Thêm nhân viên</button>
  <button class="btn outline">Hủy</button>
  <button class="btn ghost">Xem thêm</button>
  <button class="btn danger">Xóa</button>
  <button class="btn success">Duyệt</button>
  <button class="btn primary sm">Nhỏ</button>
  <button class="btn primary xs">Rất nhỏ</button>
  <button class="btn primary disabled">Vô hiệu</button>
</div>
</body>
</html>
