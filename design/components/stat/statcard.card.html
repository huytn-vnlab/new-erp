<!-- @dsCard group="Components" viewport="700x180" name="StatCard" subtitle="KPI block — big number, trend chip, accent icon tile + glow" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body{margin:0;padding:22px;background:hsl(var(--background));font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .s{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius-card);box-shadow:0 1px 2px 0 rgb(0 0 0 / .03);padding:20px;background-image:radial-gradient(ellipse 80% 60% at 100% 0%,hsl(var(--primary-h) var(--primary-s) 57% / .09),transparent 70%)}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .num{font-size:34px;font-weight:700;font-family:var(--font-heading);color:hsl(var(--foreground));line-height:1;font-variant-numeric:tabular-nums}
  .tr{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600}
  .up{color:hsl(var(--success))}.dn{color:hsl(var(--danger))}
  .sub{font-size:12px;color:hsl(var(--muted-foreground));margin-top:4px}
  .tile{height:40px;width:40px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,hsl(var(--primary-h) var(--primary-s) 60% / .16),hsl(var(--primary-h) var(--primary-s) 40% / .10));color:hsl(var(--primary))}
  .tile svg{width:18px;height:18px}
  .row2{margin-top:6px;display:flex;align-items:baseline;gap:8px}
</style>
</head>
<body>
<div class="grid">
  <div class="s"><div class="top"><div><span class="eyebrow">Tổng nhân viên</span><div class="row2"><span class="num">248</span><span class="tr up">↑ +8</span></div><div class="sub">12 phòng ban</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div></div></div>
  <div class="s"><div class="top"><div><span class="eyebrow">Đơn chờ duyệt</span><div class="row2"><span class="num">17</span><span class="tr dn">↓ -3</span></div><div class="sub">6 nghỉ phép · 11 tăng ca</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div></div></div>
  <div class="s"><div class="top"><div><span class="eyebrow">Tỷ lệ chấm công</span><div class="row2"><span class="num">96%</span><span class="tr up">↑ +2%</span></div><div class="sub">Tháng 7/2026</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 13.5"/></svg></div></div></div>
</div>
</body>
</html>
