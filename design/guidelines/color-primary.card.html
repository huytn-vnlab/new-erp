<!-- @dsCard group="Colors" viewport="700x140" name="Primary accent" subtitle="Sky-blue accent scale — built from --primary-h / --primary-s" -->
<!doctype html>
<html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;padding:20px;background:hsl(var(--background));font-family:var(--font-mono)}.row{display:flex;gap:0;border-radius:var(--radius-lg);overflow:hidden;border:1px solid hsl(var(--border))}.sw{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px}.lt{color:hsl(var(--foreground) / .6)}.dk{color:#fff}</style>
</head><body>
<div class="row">
  <div class="sw lt" style="background:hsl(var(--primary-50))">50</div>
  <div class="sw lt" style="background:hsl(var(--primary-100))">100</div>
  <div class="sw lt" style="background:hsl(var(--primary-200))">200</div>
  <div class="sw dk" style="background:hsl(var(--primary-500))">500 · base</div>
  <div class="sw dk" style="background:hsl(var(--primary-600))">600</div>
  <div class="sw dk" style="background:hsl(var(--primary-700))">700</div>
</div>
</body></html>
