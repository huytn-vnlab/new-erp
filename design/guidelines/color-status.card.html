<!-- @dsCard group="Colors" viewport="700x120" name="Status colors" subtitle="Semantic solids — success, warning, danger, info, violet" -->
<!doctype html>
<html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;padding:20px;background:hsl(var(--background));font-family:var(--font-mono)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.sw{height:64px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:7px;font-size:10px;color:#fff}.cap{font-size:10.5px;color:hsl(var(--muted-foreground));margin-top:6px;text-align:center}</style>
</head><body>
<div class="grid">
  <div><div class="sw" style="background:hsl(var(--success))">success</div><div class="cap">160 60% 45%</div></div>
  <div><div class="sw" style="background:hsl(var(--warning))">warning</div><div class="cap">35 90% 50%</div></div>
  <div><div class="sw" style="background:hsl(var(--danger))">danger</div><div class="cap">0 75% 55%</div></div>
  <div><div class="sw" style="background:hsl(var(--info))">info</div><div class="cap">203 89% 50%</div></div>
  <div><div class="sw" style="background:hsl(var(--violet))">violet</div><div class="cap">265 60% 55%</div></div>
</div>
</body></html>
