<!-- @dsCard group="Colors" viewport="700x150" name="Dark mode" subtitle="Deep navy surfaces on .dark — lighter accent" -->
<!doctype html>
<html class="dark"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;padding:20px;background:hsl(var(--background));font-family:var(--font-mono)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.sw{height:70px;border-radius:var(--radius-md);border:1px solid hsl(var(--border));display:flex;align-items:flex-end;padding:7px;font-size:10px;color:hsl(var(--muted-foreground))}.cap{font-size:10.5px;color:hsl(var(--muted-foreground));margin-top:6px;text-align:center}</style>
</head><body>
<div class="grid">
  <div><div class="sw" style="background:hsl(var(--background))"></div><div class="cap">background</div></div>
  <div><div class="sw" style="background:hsl(var(--card))"></div><div class="cap">card</div></div>
  <div><div class="sw" style="background:hsl(var(--muted))"></div><div class="cap">muted</div></div>
  <div><div class="sw" style="background:hsl(var(--popover))"></div><div class="cap">popover</div></div>
  <div><div class="sw" style="background:hsl(var(--primary))"></div><div class="cap">primary</div></div>
  <div><div class="sw" style="background:hsl(var(--border))"></div><div class="cap">border</div></div>
</div>
</body></html>
