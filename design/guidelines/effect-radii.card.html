<!-- @dsCard group="Effects" viewport="700x150" name="Corner radii" subtitle="3 checkbox · 6 button/input · 8 chip · 12 popover · 14 card · full pill" -->
<!doctype html>
<html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;padding:22px;background:hsl(var(--background))}.row{display:flex;gap:16px;align-items:flex-end}.b{width:70px;height:70px;background:hsl(var(--primary-h) var(--primary-s) 57% / .12);border:1px solid hsl(var(--primary) / .4)}.cap{font-family:var(--font-mono);font-size:10px;color:hsl(var(--muted-foreground));margin-top:6px;text-align:center}</style>
</head><body>
<div class="row">
  <div><div class="b" style="border-radius:var(--radius-xs)"></div><div class="cap">3 · xs</div></div>
  <div><div class="b" style="border-radius:var(--radius-sm)"></div><div class="cap">6 · sm</div></div>
  <div><div class="b" style="border-radius:var(--radius-md)"></div><div class="cap">8 · md</div></div>
  <div><div class="b" style="border-radius:var(--radius-lg)"></div><div class="cap">12 · lg</div></div>
  <div><div class="b" style="border-radius:var(--radius-card)"></div><div class="cap">14 · card</div></div>
  <div><div class="b" style="border-radius:var(--radius-full)"></div><div class="cap">full</div></div>
</div>
</body></html>
