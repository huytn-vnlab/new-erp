<!-- @dsCard group="Colors" viewport="700x120" name="Badge tints" subtitle="Soft tint bg + saturated same-hue label pairs" -->
<!doctype html>
<html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;padding:22px;background:hsl(var(--background))}.row{display:flex;flex-wrap:wrap;gap:12px}.b{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:500;font-family:var(--font-mono)}.d{width:7px;height:7px;border-radius:50%}</style>
</head><body>
<div class="row">
  <span class="b" style="background:hsl(var(--badge-green-bg));color:hsl(var(--badge-green-fg))"><span class="d" style="background:hsl(var(--success))"></span>green</span>
  <span class="b" style="background:hsl(var(--badge-amber-bg));color:hsl(var(--badge-amber-fg))"><span class="d" style="background:hsl(var(--warning))"></span>amber</span>
  <span class="b" style="background:hsl(var(--badge-red-bg));color:hsl(var(--badge-red-fg))"><span class="d" style="background:hsl(var(--danger))"></span>red</span>
  <span class="b" style="background:hsl(var(--badge-sky-bg));color:hsl(var(--badge-sky-fg))"><span class="d" style="background:hsl(var(--info))"></span>sky</span>
  <span class="b" style="background:hsl(var(--badge-violet-bg));color:hsl(var(--badge-violet-fg))"><span class="d" style="background:hsl(var(--violet))"></span>violet</span>
  <span class="b" style="background:hsl(var(--primary-h) var(--primary-s) 57% / .1);color:hsl(var(--primary))">primary</span>
  <span class="b" style="background:hsl(var(--muted));color:hsl(var(--muted-foreground))">gray</span>
</div>
</body></html>
