<!doctype html>
<html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;padding:26px;background:hsl(var(--background))}.row{display:flex;gap:22px}.b{flex:1;height:80px;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:hsl(var(--muted-foreground))}</style>
</head><body>
<div class="row">
  <div class="b" style="box-shadow:var(--shadow-card)">card</div>
  <div class="b" style="box-shadow:var(--shadow-card-hover)">card-hover</div>
  <div class="b" style="box-shadow:var(--shadow-popover)">popover</div>
  <div class="b" style="box-shadow:var(--shadow-primary);border-color:hsl(var(--primary) / .4)">primary glow</div>
</div>
</body></html>
