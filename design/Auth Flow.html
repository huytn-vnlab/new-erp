<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micro ERP — Landing &amp; đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="landing.css">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Be Vietnam Pro"', '"Noto Sans JP"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          heading: ['"Plus Jakarta Sans"', '"Be Vietnam Pro"', '"Noto Sans JP"', 'sans-serif'],
          display: ['"Plus Jakarta Sans"', '"Be Vietnam Pro"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        colors: {
          ink: 'hsl(var(--ink) / <alpha-value>)',
          line: 'hsl(var(--line) / <alpha-value>)',
          primary: {
            DEFAULT: 'hsl(var(--primary-h) var(--primary-s) 48% / <alpha-value>)',
            300: 'hsl(var(--primary-h) var(--primary-s) 72% / <alpha-value>)',
          },
        },
      },
    },
  };
</script>
<style>
  :root{--primary-h:203;--primary-s:89%;--ink:222 44% 12%;--line:220 14% 90%}
  html{font-family:'Be Vietnam Pro','Noto Sans JP',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums;scroll-behavior:smooth}
  h1,h2,h3,h4,.font-heading{font-family:'Plus Jakarta Sans','Be Vietnam Pro','Noto Sans JP',sans-serif;font-weight:700;letter-spacing:-.02em}
  .font-display{font-family:'Plus Jakarta Sans','Be Vietnam Pro',sans-serif;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  a{color:hsl(var(--primary-h) var(--primary-s) 42%)}
  a:hover{color:hsl(var(--primary-h) var(--primary-s) 32%)}
  .scrollbar-thin::-webkit-scrollbar{height:6px}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:hsl(var(--line));border-radius:99px}
  ::selection{background:hsl(var(--primary-h) var(--primary-s) 88%)}

  /* ---- entrance animations ---- */
  @keyframes rvUp{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
  @keyframes rvFade{from{opacity:0}to{opacity:1}}
  /* on-mount stagger (auth screens) */
  .stagger>*{animation:rvUp .5s cubic-bezier(.2,.75,.3,1) both}
  .stagger>*:nth-child(1){animation-delay:.02s}
  .stagger>*:nth-child(2){animation-delay:.07s}
  .stagger>*:nth-child(3){animation-delay:.12s}
  .stagger>*:nth-child(4){animation-delay:.17s}
  .stagger>*:nth-child(5){animation-delay:.22s}
  .stagger>*:nth-child(6){animation-delay:.27s}
  .stagger>*:nth-child(7){animation-delay:.32s}
  .stagger>*:nth-child(8){animation-delay:.37s}
  .stagger-fast>*{animation-duration:.42s}
  @media (prefers-reduced-motion:reduce){.stagger>*{animation:rvFade .01s both;opacity:1}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="bg-white text-ink">
<div id="root"></div>
<script type="text/babel" src="auth-shell.jsx"></script>
<script type="text/babel" src="auth-screens.jsx"></script>
<script type="text/babel" src="auth-landing.jsx"></script>
<script type="text/babel" src="auth-app.jsx"></script>
</body>
</html>
